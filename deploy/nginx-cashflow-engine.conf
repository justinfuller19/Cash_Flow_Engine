# CashFlow Engine is intentionally available only to private LAN clients.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    allow ::1;
    allow fc00::/7;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not forward X-Forwarded-For: the app sees nginx on loopback,
        # and nginx itself restricts incoming connections to private LAN ranges.
    }
}
